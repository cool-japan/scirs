[package]
name = "scirs2-stats"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Statistical functions module for SciRS2 (scirs2-stats)"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["statistics", "probability", "scientific", "scipy", "numerical"]
categories = ["science", "mathematics", "algorithms"]

[lints]
workspace = true
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# Core dependencies - ALL numeric/array/random functionality from scirs2-core (SciRS2 POLICY)
scirs2-core = { workspace = true, features = ["validation", "parallel", "simd", "linalg", "random", "array"] }
scirs2-linalg = { workspace = true }
scirs2-symbolic = { workspace = true, optional = true }
thiserror = { workspace = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
# CUDA backend (oxicuda-*, optional, off by default)
oxicuda-driver = { workspace = true, optional = true }
oxicuda-memory = { workspace = true, optional = true }
oxicuda-launch = { workspace = true, optional = true }
oxicuda-ptx = { workspace = true, optional = true }

# Statistics specific dependencies
statrs = { workspace = true }
num_cpus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
memmap2 = { workspace = true }
quickcheck = { workspace = true }
crossbeam = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
plotters = { workspace = true, default-features = false }
quickcheck = { workspace = true }
quickcheck_macros = { workspace = true }
rand = { workspace = true }
approx = { workspace = true }
proptest = { workspace = true }
scirs2-symbolic = { workspace = true }

[features]
default = []
# NOTE: OpenBLAS/Netlib features removed - using pure Rust OxiBLAS for all platforms
# Memory mapping support for large files
memmap = []
# Parallel processing (delegates to scirs2-core/parallel which uses rayon)
parallel = ["scirs2-core/parallel"]
# Python bindings support
python = ["scirs2-core/python"]
# Symbolic MLE: gradient descent with exact symbolic gradients via scirs2-symbolic
symbolic = ["dep:scirs2-symbolic"]
# GPU abstraction layer (delegates to scirs2-core/gpu)
gpu = ["scirs2-core/gpu"]
# Pure-Rust wgpu compute kernels for batch distribution evaluation
wgpu = ["gpu", "dep:wgpu", "dep:pollster", "scirs2-core/wgpu"]
# Pure-Rust direct oxicuda CUDA path (NVIDIA-only, runtime-probed; default off)
cuda = ["dep:oxicuda-driver", "dep:oxicuda-memory", "dep:oxicuda-launch", "dep:oxicuda-ptx"]

[[bench]]
name = "distributions"
harness = false

[[bench]]
name = "statistical_tests"
harness = false

[[bench]]
name = "scipy_comparison"
harness = false

[[bench]]
name = "comprehensive_scipy_comparison"
harness = false

[[bench]]
name = "simd_correlation_bench"
harness = false

[[bench]]
name = "v020_simd_comprehensive"
harness = false


