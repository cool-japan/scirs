[package]
name = "scirs2-cluster"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Clustering algorithms module for SciRS2 (scirs2-cluster)"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["clustering", "scientific", "scipy", "numerical", "kmeans"]
categories = ["science", "mathematics", "algorithms"]

[lints]
workspace = true
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# Core dependencies - ALL numeric/array/random functionality from scirs2-core (SciRS2 POLICY)
scirs2-core = { workspace = true, features = ["parallel", "simd", "array", "random"] }
scirs2-spatial = { workspace = true }
scirs2-linalg = { workspace = true }
# scirs2-stats = { workspace = true } # Temporarily disabled due to compilation errors
statrs = { workspace = true }
thiserror = { workspace = true }
approx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
oxiarc-deflate = { workspace = true }  # Pure Rust GZIP compression (COOLJAPAN Policy)
chrono = { workspace = true }
num_cpus = { workspace = true }

# Optional serialization formats
serde_yaml = { workspace = true, optional = true }

# Temporary file handling
tempfile = { workspace = true }

# UUID generation for model versioning
uuid = { workspace = true }

# Optional visualization libraries
plotters = { workspace = true, default-features = false, optional = true }
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }

[features]
default = ["json", "binary"]
json = []
binary = []
yaml = ["serde_yaml"]
msgpack = []
cbor = []
all_formats = ["yaml", "msgpack", "cbor"]

# Compression features
lz4_compression = []
zstd_compression = []
bzip2_compression = []
all_compression = ["lz4_compression", "zstd_compression", "bzip2_compression"]

# SIMD acceleration for clustering operations
simd = ["scirs2-core/simd"]

# GPU acceleration features
gpu = []
cuda = ["gpu"]
rocm = ["gpu"]
gpu_all = ["cuda", "rocm"]

# Python interoperability via scirs2-core conversion utilities
python = ["scirs2-core/python"]

# Visualization features
plotters = ["dep:plotters"]
egui = ["dep:egui", "dep:eframe"]
visualization = ["plotters", "egui"]

[[bench]]
name = "clustering_benchmarks"
harness = false

