[package]
name = "scirs2-datasets"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Datasets module for SciRS2 (scirs2-datasets)"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/cool-japan/scirs"
documentation = "https://docs.rs/scirs2-datasets"
keywords = ["datasets", "machine-learning", "data", "scientific", "scipy"]
categories = ["science", "data-structures", "algorithms"]

[lints]
workspace = true
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Core dependencies - ALL numeric/array/random functionality from scirs2-core (SciRS2 POLICY)
scirs2-core = { workspace = true, features = ["cache", "random", "gpu", "parallel", "array"] }
thiserror = { workspace = true }
num_cpus = { workspace = true }

# Data handling
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
statrs = { workspace = true }

# Datasets specific dependencies
reqwest = { workspace = true, optional = true, features = ["stream"] }
# Pure-Rust rustls CryptoProvider (OxiTLS, `oxitls-rustcrypto-provider` resolved under the
# `rustls-rustcrypto` name -- see the "PURE RUST BLOCKER (reqwest)" note in the workspace root
# Cargo.toml). Installed as the process-default provider by src/tls.rs right before every eager
# reqwest client construction, unless the application already installed a provider of its own.
rustls = { workspace = true, optional = true }
rustls-rustcrypto = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
blake3 = { workspace = true }
sha2 = { workspace = true }
lazy_static = { workspace = true }
ureq = { workspace = true, optional = true }
tempfile = { workspace = true }
memmap2 = { workspace = true, optional = true }
crossbeam-channel = { workspace = true }

# v0.2.0: File format support via scirs2-io integration
scirs2-io = { workspace = true, optional = true, features = ["parquet", "hdf5", "async"] }

# v0.4.3: Native Parquet reader (Item 6)
parquet = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
indexmap = { workspace = true }

# v0.4.3: HDF5 reader (Item 7) — pure Rust via oxih5, no C library (COOLJAPAN Policy)
oxih5 = { workspace = true, optional = true }

# v0.4.3: NetCDF3 reader (Item 8) — pure Rust, always available
netcdf3 = { workspace = true }

# Phase 2 (0.6.0): optional NVIDIA-only CUDA backend via oxicuda-* library crates.
oxicuda-driver = { workspace = true, optional = true }
oxicuda-memory = { workspace = true, optional = true }
oxicuda-blas = { workspace = true, optional = true }

# v0.2.0: Benchmarking
criterion = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }

[features]
default = ["download-sync", "lazy-loading", "augmentation"]
download = ["reqwest", "futures-util", "tokio", "dep:rustls", "dep:rustls-rustcrypto"]
download-sync = ["ureq", "dep:rustls", "dep:rustls-rustcrypto"]
parallel = ["scirs2-core/parallel"]

# v0.2.0 features
lazy-loading = ["memmap2"]
augmentation = ["scirs2-core/gpu"]
# Real GPU-accelerated dataset generation via scirs2-core's wgpu-backed GpuNdarray.
# Mirrors scirs2-optimize's `wgpu` feature, which enables `scirs2-core/array_protocol_wgpu`.
wgpu = ["scirs2-core/array_protocol_wgpu"]
cuda = ["dep:oxicuda-driver", "dep:oxicuda-memory", "dep:oxicuda-blas"]
formats = ["scirs2-io", "dep:arrow", "dep:parquet"]
distributed = ["tokio"]
benchmarks = ["criterion"]
v0_2_0 = ["lazy-loading", "augmentation", "formats", "distributed", "parallel"]

# v0.4.3: New data format readers
# Native Parquet read (Item 6) — activates parquet + arrow crates
parquet_io = ["dep:parquet", "dep:arrow"]
# HDF5 dataset containers (Item 7) — activates the pure-Rust oxih5 crate
hdf5_io = ["dep:oxih5"]

# [[bench]]
# name = "pytorch_comparison"
# harness = false
# required-features = ["benchmarks"]