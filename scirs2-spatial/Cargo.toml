[package]
name = "scirs2-spatial"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Spatial algorithms module for SciRS2 (scirs2-spatial)"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["spatial", "distance", "scientific", "scipy", "numerical"]
categories = ["science", "mathematics", "algorithms"]

[lints]
workspace = true
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# Core dependencies
scirs2-core = { workspace = true, features = ["simd", "parallel", "linalg", "random", "types"] }
# Removed ndarray, num-complex, rand - use scirs2-core abstractions per SciRS2 policy
thiserror = { workspace = true }
num-traits = { workspace = true }
statrs = { workspace = true }
approx = { workspace = true }

# Temporary: rand needed for compatibility during migration to scirs2_core::random
rand = { workspace = true }

# System dependencies for NUMA
libc = { workspace = true }

# Async runtime for tensor core operations
tokio = { workspace = true, features = ["rt", "rt-multi-thread"], optional = true }

# CPU detection for adaptive selection
num_cpus = { workspace = true }

# Linear algebra dependencies handled through scirs2-core
# scirs2-linalg = { workspace = true }  # Temporarily disabled due to compilation errors
# ndarray-linalg = { workspace = true } # Removed - use scirs2-core BLAS abstractions

[features]
default = ["parallel"]
parallel = []
async = ["dep:tokio"]
cuda = []
rocm = []
vulkan = []
# Research-fringe / experimental APIs that are NOT production-ready.
# Currently gates `SelfOptimizingAlgorithm` (runtime self-optimizing clustering),
# whose hardware-counter-guided code generation is not yet implemented; with the
# feature enabled it returns an honest `NotImplementedError` rather than
# fabricating performance metrics. Excluded from the default build.
experimental = []

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
# Removed rand_chacha - use scirs2-core random abstractions per SciRS2 policy
plotters = { workspace = true, default-features = false }
num_cpus = { workspace = true }
tokio-test = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "spatial_benchmarks"
harness = false

[[bench]]
name = "simple_spatial_bench"
harness = false

[[bench]]
name = "quick_spatial_bench"
harness = false

[[bench]]
name = "minimal_bench"
harness = false

[[bench]]
name = "simd_bench"
harness = false

[[bench]]
name = "advanced_modules_performance"
harness = false

[[bench]]
name = "scipy_comparison_v020"
harness = false

