[package]
name = "scirs2-graph"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Graph processing module for SciRS2 (scirs2-graph)"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["graph", "network", "scientific", "ai", "machine-learning"]
categories = ["science", "mathematics", "algorithms"]

[lints]
workspace = true
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# Core dependencies - ALL numeric/array/random functionality from scirs2-core (SciRS2 POLICY)
scirs2-core = { workspace = true, features = ["parallel", "simd", "random", "array"] }
thiserror = { workspace = true }

# Graph processing specific dependencies
petgraph = { workspace = true }
ordered-float = { workspace = true }

# Performance dependencies
# rayon = "1.8"  # Now use scirs2-core parallel abstractions
parking_lot = { workspace = true }
sysinfo = { workspace = true }

# Serialization for attributes and embeddings
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# GPU acceleration (optional, behind `wgpu` feature)
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

# Optional, off-by-default, NVIDIA-only CUDA backend (direct oxicuda-* path deps).
# oxicuda-sparse transitively pulls oxicuda-launch / -ptx / -blas.
oxicuda-driver = { workspace = true, optional = true }
oxicuda-memory = { workspace = true, optional = true }
oxicuda-sparse = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
num_cpus = { workspace = true }
approx = { workspace = true }

[features]
default = ["std", "sysinfo"]

# Core features
std = []
unstable = []

# Performance features
parallel = ["scirs2-core/parallel"]
simd = ["scirs2-core/simd"]
wgpu = ["scirs2-core/gpu", "scirs2-core/wgpu", "dep:wgpu", "dep:pollster", "dep:bytemuck"]

# Optional, off-by-default, NVIDIA-only CUDA acceleration for sparse graph
# linear algebra (adjacency-matrix SpMV) via the pure-Rust oxicuda library
# crates. Compiles everywhere; the runtime probe returns false when no NVIDIA
# device is present (e.g. macOS), so callers fall back to the CPU SpMV.
cuda = ["dep:oxicuda-driver", "dep:oxicuda-memory", "dep:oxicuda-sparse"]
sysinfo = []

# Algorithm features
experimental_algorithms = ["unstable"]
advanced_centrality = []
neural_networks = []

# I/O features
extra_formats = []
compression = []

# Development features
benchmarks = []
profiling = []
validation = []

# Compatibility features
networkx_compat = []
igraph_compat = []

# All features (for comprehensive testing)
full = [
    "parallel", 
    "simd", 
    "advanced_centrality",
    "extra_formats",
    "benchmarks",
    "profiling",
    "validation",
    "networkx_compat"
]

[[example]]
name = "graph_demo"
path = "examples/graph_demo.rs"

[[example]]
name = "refactor_demo"
path = "examples/refactor_demo.rs"

[[example]]
name = "hypergraph_demo"
path = "examples/hypergraph_demo.rs"

[[bench]]
name = "graph_benchmarks"
harness = false

[[bench]]
name = "memory_benchmarks"
harness = false

[[bench]]
name = "large_graph_stress"
harness = false

[[bench]]
name = "advanced_algorithms"
harness = false

[[bench]]
name = "performance_optimizations"
harness = false

[[bench]]
name = "benchmark_runner"
harness = false

[[bench]]
name = "performance_regression"
harness = false
